name: Interoperability

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qpdf:
    name: qpdf external validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-qpdf-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Install qpdf and poppler
        timeout-minutes: 5
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends qpdf poppler-utils

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned veraPDF
        timeout-minutes: 5
        run: |
          curl --fail --location --retry 3 https://software.verapdf.org/releases/1.30/verapdf-greenfield-1.30.3-installer.zip -o "$RUNNER_TEMP/verapdf.zip"
          echo "b512bf24945503a33fc10738ecffc1f2dccaaf8593a448e94ee9ac86a9559a59  $RUNNER_TEMP/verapdf.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/verapdf.zip" -d "$RUNNER_TEMP/verapdf-installer"
          python3 - <<'PYINSTALL'
          import os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          template = Path("tools/verification/verapdf-auto.xml").read_text()
          (temp / "verapdf-auto.xml").write_text(template.replace("@INSTALL_PATH@", str(temp / "verapdf")))
          PYINSTALL
          java -jar "$RUNNER_TEMP/verapdf-installer/verapdf-greenfield-1.30.3/verapdf-izpack-installer-1.30.3.jar" "$RUNNER_TEMP/verapdf-auto.xml"
          # The CLI creates its config files on first launch without an atomic
          # check/create sequence. Initialize before parallel validator tests.
          "$RUNNER_TEMP/verapdf/verapdf" --version
          echo "$RUNNER_TEMP/verapdf" >> "$GITHUB_PATH"

      - name: Verify external validator wrappers with real qpdf and veraPDF
        run: cargo test --locked -p oxidize-pdf --test issue_729_external_validators_test -- --ignored

      - name: Validate semantic comparison differentially
        env:
          OXIDIZE_PDF_REQUIRE_DIFFERENTIAL_TOOLS: "1"
        run: cargo test -p oxidize-pdf --test semantic_comparison_differential

      - name: Verify irreversible redaction with qpdf and Poppler
        run: >-
          cargo test -p oxidize-pdf
          --test issue_730_redaction_boundaries_test
          independent_output_oracle
          -- --ignored --exact

      - name: Verify retained font resources with qpdf and Poppler
        run: >-
          cargo test --locked -p oxidize-pdf
          --test issue_792_redaction_resources_test
          independent_resource_oracle
          -- --ignored --exact

      - name: Verify unsupported pivot output and real dashboard controls
        run: >-
          cargo test --locked -p oxidize-pdf
          --test issue_738_pivot_contract_test independent_output_oracle
          -- --ignored --exact

      - name: Verify dashboard overflow identities with qpdf and Poppler
        run: >-
          cargo test --locked -p oxidize-pdf
          --test issue_727_dashboard_overflow_test
          independent_output_oracle
          -- --ignored --exact

      - name: Verify XMP identifiers with an independent XML parser
        run: >-
          cargo test --locked -p oxidize-pdf
          --test issue_741_xmp_identifier_test
          independent_xml_reader_agrees_on_identifier_forms
          -- --ignored --exact

      - name: Verify XMP round trips with an independent XML parser
        run: >-
          cargo test --locked -p oxidize-pdf
          --test issue_763_xmp_roundtrip_test
          independent_xml_reader_checks_every_serialized_property
          -- --ignored --exact

      - name: Verify packed grayscale image samples and source PDFs
        run: >-
          cargo test --locked -p oxidize-pdf --features external-images
          --test issue_732_packed_gray_test -- --include-ignored

      - name: Verify ordered tagged mutations with qpdf
        run: >-
          cargo test --locked -p oxidize-pdf
          --test issue_762_ordered_mutations_test
          independent_qpdf_observes_restored_value_and_generation
          -- --ignored --exact

      - name: Verify simple-font encodings against Poppler
        run: >-
          cargo test --locked -p oxidize-pdf
          --test issue_731_simple_encoding_test
          independent_poppler_standard_encoding_control
          -- --ignored --exact

      - name: Verify CMYK conversion and independent alpha
        run: >-
          cargo test --locked -p oxidize-pdf --features external-images
          --test issue_733_cmyk_extraction_test

      - name: Verify 16-bit PNG samples through PDF streams
        run: >-
          cargo test --locked -p oxidize-pdf --features external-images
          --test issue_736_png_depth_test -- --include-ignored

      - name: Verify inline image grammar and independently decoded PNG samples
        run: >-
          cargo test --locked -p oxidize-pdf --features external-images
          --test issue_734_inline_images_test

      - name: Verify binary file attachments with qpdf and Poppler
        run: >-
          cargo test --locked -p oxidize-pdf
          --test issue_774_file_attachment_test -- --include-ignored

      - name: Verify streaming writer object graph and xref with qpdf
        run: >-
          cargo test --locked -p oxidize-pdf --features performance
          --test issue_728_streaming_writer_test
          -- --include-ignored

      - name: Validate incremental text notes
        run: >
          cargo test -p oxidize-pdf
          --test issue_493_incremental_text_notes_test
          qpdf_accepts_incremental_text_note_revision
          -- --ignored --exact

      - name: Validate incremental highlights
        run: >
          cargo test -p oxidize-pdf
          --test issue_525_incremental_highlights_test
          qpdf_accepts_classic_and_xref_stream_highlight_revisions
          -- --ignored --exact

      - name: Validate incremental ink annotations
        run: >
          cargo test -p oxidize-pdf
          --test issue_536_incremental_ink_test
          qpdf_accepts_classic_and_xref_stream_ink_revisions
          -- --ignored --exact

      - name: Validate incremental geometric annotations
        run: >
          cargo test -p oxidize-pdf
          --test issue_537_incremental_geometric_test
          qpdf_accepts_classic_and_xref_stream_geometric_revisions
          -- --ignored --exact

      - name: Validate lossless page-tree mutations
        run: >
          cargo test -p oxidize-pdf
          --test issue_538_page_tree_mutations_test
          qpdf_and_poppler_accept_classic_and_xref_stream_page_mutations
          -- --ignored --exact

      - name: Validate incremental OCR layers
        run: >
          cargo test -p oxidize-pdf
          --test issue_542_incremental_ocr_test
          qpdf_accepts_classic_and_xref_stream_ocr_revisions
          -- --ignored --exact

      - name: Validate incremental signature appearances
        run: >
          cargo test -p oxidize-pdf
          --test issue_540_incremental_signing_test
          -- --ignored

      - name: Validate incremental objects and external document timestamps
        run: >-
          cargo test --locked -p oxidize-pdf
          --test issue_714_incremental_primitives_test -- --ignored

      - name: Validate AES-256 R5 interoperability
        run: >
          cargo test -p oxidize-pdf
          --test issue_492_aes256_perms_interop_test
          qpdf_checks_and_linearizes_generated_aes256_r5_pdf
          -- --ignored --exact

  wasm-encryption:
    name: WASM encryption in Node and Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked
      - name: Build and validate Node consumer
        run: |
          wasm-pack build tools/wasm-encryption-regression --target nodejs --out-dir pkg-node --dev --no-opt --locked
          node tools/wasm-encryption-regression/node_test.cjs
      - name: Build and validate Chrome consumer
        run: |
          wasm-pack build tools/wasm-encryption-regression --target web --dev --no-opt --locked
          node tools/wasm-encryption-regression/browser_test.cjs
