name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # First verify this is a valid release trigger
  verify-release-conditions:
    name: Verify Release Conditions
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check_conditions.outputs.should_release }}
      version_tag: ${{ steps.check_conditions.outputs.version_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          
      - name: Check release conditions
        id: check_conditions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_release_conditions.py

  # Then verify that all CI checks are passing
  check-ci-status:
    name: Verify CI Status
    runs-on: ubuntu-latest
    needs: verify-release-conditions
    if: needs.verify-release-conditions.outputs.should_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Require complete current-main validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_release_gate.py

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [verify-release-conditions, check-ci-status]
    if: needs.verify-release-conditions.outputs.should_release == 'true'
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Find equivalent optimized validation
        id: optimized
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_evidence.py --role optimized --job 'Optimized release tests' --workflow ci.yml

      - name: Validate changed optimized build inputs
        if: steps.optimized.outputs.hit != 'true'
        run: cargo test --locked --all --release

      - name: Build release binaries
        run: cargo build --locked --all --release

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION_TAG="${{ needs.verify-release-conditions.outputs.version_tag }}"
          VERSION="${VERSION_TAG#v}"  # Remove 'v' prefix
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify tag and package version, prepare immutable package
        env:
          RELEASE_TAG: ${{ needs.verify-release-conditions.outputs.version_tag }}
        run: |
          python3 - <<'PYVERSION'
          import os, tomllib
          with open('Cargo.toml', 'rb') as source:
              version = tomllib.load(source)['workspace']['package']['version']
          if os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('Tag differs from workspace package version')
          PYVERSION
          cargo package --locked -p oxidize-pdf

      - name: Recheck candidate CI immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_release_gate.py

      # Check if packages need new versions before publishing
      - name: Check version changes
        id: version_check
        run: |
          # Get current version from workspace Cargo.toml
          CORE_VERSION=$(grep -A5 "^\[workspace\.package\]" Cargo.toml | grep "^version = " | cut -d'"' -f2)

          echo "core_version=$CORE_VERSION" >> $GITHUB_OUTPUT

          # Check if version exists on crates.io
          echo "Checking if version exists on crates.io..."
          echo "Core version to check: $CORE_VERSION"

          # Check core package
          STATUS=$(curl --silent --show-error --location --user-agent 'oxidize-pdf-release (https://github.com/bzsanti/oxidizePdf)' --output registry-version.json --write-out '%{http_code}' "https://crates.io/api/v1/crates/oxidize-pdf/$CORE_VERSION")
          case "$STATUS" in
            200) echo "core_needs_publish=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "core_needs_publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Registry lookup failed: HTTP $STATUS"; exit 1 ;;
          esac

      # Publish to crates.io (only if the exact version is absent)
      - name: Publish oxidize-pdf to crates.io
        if: steps.version_check.outputs.core_needs_publish == 'true'
        run: cargo publish --locked -p oxidize-pdf
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Verify published package identity
        env:
          PACKAGE_VERSION: ${{ steps.version_check.outputs.core_version }}
        run: python3 scripts/ci_verify_package.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## oxidize-pdf v${{ steps.get_version.outputs.VERSION }}

            See [CHANGELOG.md](https://github.com/bzsanti/oxidizePdf/blob/main/CHANGELOG.md) for details.

            ### Installation

            Add to your `Cargo.toml`:
            ```toml
            [dependencies]
            oxidize-pdf = "${{ steps.get_version.outputs.VERSION }}"
            ```

      - name: Release Summary
        run: |
          echo "🎉 Release v${{ steps.get_version.outputs.VERSION }} completed successfully!"
          echo ""
          echo "✅ Released packages:"
          if [ "${{ steps.version_check.outputs.core_needs_publish }}" == "true" ]; then
            echo "  - oxidize-pdf v${{ steps.get_version.outputs.VERSION }}"
          fi
          echo ""
          echo "📦 GitHub Release: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.get_version.outputs.VERSION }}"
          echo "🚀 Packages available on crates.io"
