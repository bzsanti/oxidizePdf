name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, develop, develop_santi ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.rust == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
        # beta temporarily disabled - needs API updates for benchmarks
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tests-${{ matrix.os }}-${{ matrix.rust }}
          cache-workspace-crates: 'false'

      - name: Find equivalent validation
        id: reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_evidence.py --role 'tests' --job 'Test (${{ matrix.os }}, ${{ matrix.rust }})' --workflow 'ci.yml'

      - name: Check formatting
        if: steps.reuse.outputs.hit != 'true'
        # Drive rustfmt directly in xargs-chunked batches instead of `cargo fmt`.
        # `cargo fmt --all` passes every workspace target root (~400+ examples/tests)
        # to a single rustfmt invocation; on windows-latest that command line exceeds
        # the ~32 KiB CreateProcess limit and fails with `os error 206` (ERROR_FILENAME_
        # EXCED_RANGE) before checking anything. xargs splits into bounded batches, so
        # this stays correct as the target count grows. bash runs on all three runners.
        shell: bash
        run: >
          find oxidize-pdf-core -name '*.rs' -not -path '*/target/*' -not -path '*/benches.disabled/*' -print0
          | xargs -0 -r -n 60 rustfmt --edition 2021 --check

      - name: Check for backup files
        if: steps.reuse.outputs.hit != 'true' && (matrix.os != 'windows-latest')
        run: |
          if find . -name "*.backup" -o -name "*_old.rs" | grep .; then
            echo "ERROR: Backup files found in repository"
            exit 1
          fi

      - name: Check for backup files (Windows)
        if: steps.reuse.outputs.hit != 'true' && (matrix.os == 'windows-latest')
        shell: pwsh
        run: |
          $backups = Get-ChildItem -Recurse -Include "*.backup","*_old.rs" -ErrorAction SilentlyContinue
          if ($backups) {
            Write-Error "ERROR: Backup files found in repository"
            exit 1
          }

      - name: Run clippy
        if: steps.reuse.outputs.hit != 'true'
        run: cargo clippy --all --locked -- -D warnings

      - name: Build
        if: steps.reuse.outputs.hit != 'true'
        run: cargo build --all --locked --verbose

      - name: Run tests (macOS beta - lib only)
        if: steps.reuse.outputs.hit != 'true' && (matrix.os == 'macos-latest' && matrix.rust == 'beta')
        run: cargo test --lib --locked --verbose

      - name: Run tests (all others)
        if: steps.reuse.outputs.hit != 'true' && (matrix.os != 'macos-latest' || matrix.rust != 'beta')
        run: cargo test --all --locked --features internal-testing --verbose

      # The analysis SPI is gated behind `unstable-spi` (+ `semantic` for the
      # enricher/extra bag), so the default test step above never compiles its
      # tests. Exercise the SPI feature matrix on Linux/stable (spec §10.6).
      - name: Run analysis SPI tests (unstable-spi)
        if: steps.reuse.outputs.hit != 'true' && (matrix.os == 'ubuntu-latest' && matrix.rust == 'stable')
        run: cargo test -p oxidize-pdf --locked --features "internal-testing,unstable-spi" --verbose

      - name: Run analysis SPI tests (unstable-spi + semantic)
        if: steps.reuse.outputs.hit != 'true' && (matrix.os == 'ubuntu-latest' && matrix.rust == 'stable')
        run: cargo test -p oxidize-pdf --locked --features "internal-testing,unstable-spi,semantic" --verbose

      - name: Verify semantic token budgets with cl100k_base
        if: steps.reuse.outputs.hit != 'true' && matrix.rust == 'stable'
        run: cargo test -p oxidize-pdf --locked --features tiktoken --test issue_847_semantic_token_budget_test --test semantic_chunking_test --test issue_377_token_counter_test

      - name: Build documentation
        if: steps.reuse.outputs.hit != 'true'
        run: cargo doc --all --locked --no-deps

      - name: Record validation evidence
        if: steps.reuse.outputs.hit != 'true' && steps.reuse.outputs.artifact != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.reuse.outputs.artifact }}
          path: .ci-evidence/inputs.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

  examples:
    name: Examples compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The `test` job runs `cargo build --all --locked`, which builds workspace
      # packages' default targets only — examples are NOT default targets, so a
      # broken or removed-API example is invisible to CI without this job. The
      # script's compile gate (`cargo check --examples --all-features`) closes
      # that gap. The output gate (`--run`) is skipped here: it needs the corpus
      # cache, which requires network the CI runner does not use.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-examples-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify examples compile
        run: ./scripts/verify-examples.sh

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Pin the declared MSRV. This job is the gate that catches dependency
      # drift past the MSRV (the lack of which let edition-2024 deps silently
      # break the previously-declared 1.77). `--locked` fails if the committed
      # Cargo.lock resolves to versions incompatible with 1.88.
      - name: Install Rust 1.88 (MSRV)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.88"

      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-msrv-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      # Build only — the optional OCR adapter shells out to Tesseract at runtime,
      # so neither the executable nor a C development package is needed here.
      - name: Build library on MSRV (all features, locked)
        run: cargo build --lib --all-features --locked

  semver:
    name: SemVer (no undeclared breaking changes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Gate that catches breaking public-API changes that would be published
      # without the corresponding major bump. The baseline is the crate's latest
      # release on crates.io; the action fails the job when the source introduces
      # a major-requiring change (removed/renamed public item, new enum variant on
      # a non-`#[non_exhaustive]` enum, changed signature, etc.) that the manifest
      # version does not accommodate. Additive (minor) and patch changes pass.
      #
      # Rationale: a breaking change slipped into a MINOR once (#375) because there
      # was no such gate. With ~17K crates.io downloads and an anonymous
      # third-party consumer base, breaking changes must be batched into a planned
      # MAJOR bundle, never leak into a minor. rustdoc-JSON generation only
      # compiles the crate; the optional OCR executable is not needed, same as
      # the MSRV and examples compile gates.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-semver-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Check semver (oxidize-pdf)
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: oxidize-pdf
          # Development accumulates backward-compatible API changes before a
          # release version is chosen. PRs explicitly labelled `semver-major`
          # belong to a planned major release train and may contain breaking
          # API changes. Other changes targeting develop remain limited to a
          # minor release; release/main checks derive the required bump from
          # Cargo.toml and the published baseline.
          release-type: ${{ (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'semver-major') && 'major') || (((github.event_name == 'pull_request' && github.base_ref == 'develop') || github.ref == 'refs/heads/develop') && 'minor') || '' }}

  optimized:
    name: Optimized validation
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/optimized-tests.yml

  release-profile:
    name: Optimized release tests
    needs: optimized
    if: always() && (github.base_ref == 'main' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Require complete optimized validation
        env:
          RESULT: ${{ needs.optimized.result }}
        run: test "$RESULT" = success

  evidence-contract:
    name: CI evidence contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify evidence and release gates
        run: python3 -m unittest discover -s scripts -p 'test_ci_*.py' -v

  coverage:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    needs: [test, examples, msrv, semver]
    continue-on-error: true

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils qpdf tesseract-ocr tesseract-ocr-spa

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@671164c891d3e20f5b8ece04798d0154d1262d65 # cargo-llvm-cov

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-llvmcov-${{ hashFiles('**/Cargo.lock') }}

      # Coverage from BOTH unit tests (in src/) AND integration tests (in
      # tests/). The previous tarpaulin invocation used `--run-types Lib`, which
      # counted only unit tests; the ~1900 integration tests that validate the
      # parser, writer, font and extraction code (e.g. cff_subsetter.rs has zero
      # unit tests but several integration tests) contributed nothing, so files
      # like cff_subsetter.rs reported 0% despite being well tested.
      #
      # The heavy corpus tier (t1_spec / t3_stress, ~2700 PDFs) self-skips with
      # an early return when `test-corpus/` is absent — we do not download it
      # here — so it adds no time. cargo-llvm-cov runs lib + integration tests
      # of the oxidize-pdf package by default.
      - name: Find equivalent validation
        id: reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_evidence.py --role 'coverage' --job 'Generate Coverage Report' --workflow 'ci.yml' --extra "$(cargo llvm-cov --version) $(pdftotext -v 2>&1) $(qpdf --version) $(tesseract --version 2>&1) $(dpkg-query -W tesseract-ocr-spa)"

      - name: Generate coverage
        if: steps.reuse.outputs.hit != 'true'
        run: |
          cargo llvm-cov -p oxidize-pdf --no-report
          cargo llvm-cov -p oxidize-pdf --no-report \
            --features ocr-tesseract \
            --test issue_708_tesseract_test --test issue_708_ocr_geometry_test \
            -- --include-ignored
          cargo llvm-cov report \
            --lcov \
            --output-path lcov.info \
            --ignore-filename-regex '(/tests/|/examples/|/benches/|/dev-tools/)'
        timeout-minutes: 45

      - name: Upload coverage to Codecov
        if: steps.reuse.outputs.hit != 'true'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: lib-and-integration
          name: codecov-umbrella

      - name: Record validation evidence
        if: steps.reuse.outputs.hit != 'true' && steps.reuse.outputs.artifact != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.reuse.outputs.artifact }}
          path: .ci-evidence/inputs.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
