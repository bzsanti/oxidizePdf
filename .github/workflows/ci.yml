name: CI

on:
  push:
    branches: [ main, develop, develop_santi ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.rust == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
        # beta temporarily disabled - needs API updates for benchmarks
    steps:
      - uses: actions/checkout@v5
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Install qpdf (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y qpdf

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        # Drive rustfmt directly in xargs-chunked batches instead of `cargo fmt`.
        # `cargo fmt --all` passes every workspace target root (~400+ examples/tests)
        # to a single rustfmt invocation; on windows-latest that command line exceeds
        # the ~32 KiB CreateProcess limit and fails with `os error 206` (ERROR_FILENAME_
        # EXCED_RANGE) before checking anything. xargs splits into bounded batches, so
        # this stays correct as the target count grows. bash runs on all three runners.
        shell: bash
        run: >
          find oxidize-pdf-core -name '*.rs' -not -path '*/target/*' -not -path '*/benches.disabled/*' -print0
          | xargs -0 -r -n 60 rustfmt --edition 2021 --check

      - name: Check for backup files
        if: matrix.os != 'windows-latest'
        run: |
          if find . -name "*.backup" -o -name "*_old.rs" | grep .; then
            echo "ERROR: Backup files found in repository"
            exit 1
          fi

      - name: Check for backup files (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $backups = Get-ChildItem -Recurse -Include "*.backup","*_old.rs" -ErrorAction SilentlyContinue
          if ($backups) {
            Write-Error "ERROR: Backup files found in repository"
            exit 1
          }

      - name: Run clippy
        run: cargo clippy --all -- -D warnings

      - name: Build
        run: cargo build --all --verbose

      - name: Run tests (macOS beta - lib only)
        if: matrix.os == 'macos-latest' && matrix.rust == 'beta'
        run: cargo test --lib --verbose

      - name: Run tests (all others)
        if: matrix.os != 'macos-latest' || matrix.rust != 'beta'
        run: cargo test --all --features internal-testing --verbose

      - name: Validate incremental text notes with qpdf
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: >
          cargo test -p oxidize-pdf
          --test issue_493_incremental_text_notes_test
          qpdf_accepts_incremental_text_note_revision
          -- --ignored --exact

      - name: Validate AES-256 R5 interoperability with qpdf
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: >
          cargo test -p oxidize-pdf
          --test issue_492_aes256_perms_interop_test
          qpdf_checks_and_linearizes_generated_aes256_r5_pdf
          -- --ignored --exact

      # The analysis SPI is gated behind `unstable-spi` (+ `semantic` for the
      # enricher/extra bag), so the default test step above never compiles its
      # tests. Exercise the SPI feature matrix on Linux/stable (spec §10.6).
      - name: Run analysis SPI tests (unstable-spi)
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: cargo test -p oxidize-pdf --features "internal-testing,unstable-spi" --verbose

      - name: Run analysis SPI tests (unstable-spi + semantic)
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: cargo test -p oxidize-pdf --features "internal-testing,unstable-spi,semantic" --verbose

      - name: Build documentation
        run: cargo doc --all --no-deps

  examples:
    name: Examples compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The `test` job runs `cargo build --all`, which builds workspace
      # packages' default targets only — examples are NOT default targets, so a
      # broken or removed-API example is invisible to CI without this job. The
      # script's compile gate (`cargo check --examples --all-features`) closes
      # that gap. The output gate (`--run`) is skipped here: it needs the corpus
      # cache, which requires network the CI runner does not use.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-examples-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify examples compile
        run: ./scripts/verify-examples.sh

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pin the declared MSRV. This job is the gate that catches dependency
      # drift past the MSRV (the lack of which let edition-2024 deps silently
      # break the previously-declared 1.77). `--locked` fails if the committed
      # Cargo.lock resolves to versions incompatible with 1.88.
      - name: Install Rust 1.88 (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-msrv-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      # Build only — the optional OCR adapter shells out to Tesseract at runtime,
      # so neither the executable nor a C development package is needed here.
      - name: Build library on MSRV (all features, locked)
        run: cargo build --lib --all-features --locked

  semver:
    name: SemVer (no undeclared breaking changes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Gate that catches breaking public-API changes that would be published
      # without the corresponding major bump. The baseline is the crate's latest
      # release on crates.io; the action fails the job when the source introduces
      # a major-requiring change (removed/renamed public item, new enum variant on
      # a non-`#[non_exhaustive]` enum, changed signature, etc.) that the manifest
      # version does not accommodate. Additive (minor) and patch changes pass.
      #
      # Rationale: a breaking change slipped into a MINOR once (#375) because there
      # was no such gate. With ~17K crates.io downloads and an anonymous
      # third-party consumer base, breaking changes must be batched into a planned
      # MAJOR bundle, never leak into a minor. rustdoc-JSON generation only
      # compiles the crate; the optional OCR executable is not needed, same as
      # the MSRV and examples compile gates.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-semver-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Check semver (oxidize-pdf)
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: oxidize-pdf
          # Development accumulates backward-compatible API changes before a
          # release version is chosen. Allow minor-level changes on develop,
          # while release/main checks continue deriving the required bump from
          # Cargo.toml and the published baseline.
          release-type: ${{ ((github.event_name == 'pull_request' && github.base_ref == 'develop') || github.ref == 'refs/heads/develop') && 'minor' || '' }}
