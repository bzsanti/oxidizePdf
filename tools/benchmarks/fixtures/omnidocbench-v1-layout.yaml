detection_eval:
  metrics:
    - COCODet
  dataset:
    dataset_name: detection_dataset_simple_format
    ground_truth:
      data_path: /dataset/OmniDocBench.json
    prediction:
      data_path: /predictions/layout.json
  categories:
    eval_cat:
      block_level:
        - title
        - text
        - abandon
        - figure
        - figure_caption
        - table
        - table_caption
        - table_footnote
        - isolate_formula
        - formula_caption
      span_level: []
    gt_cat_mapping:
      figure_footnote: figure_footnote
      figure_caption: figure_caption
      page_number: abandon
      header: abandon
      page_footnote: abandon
      table_footnote: table_footnote
      code_txt: figure
      equation_caption: formula_caption
      equation_isolated: isolate_formula
      table: table
      refernece: text
      table_caption: table_caption
      figure: figure
      title: title
      text_block: text
      footer: abandon
    pred_cat_mapping:
      title: title
      plain text: text
      abandon: abandon
      figure: figure
      table: table
