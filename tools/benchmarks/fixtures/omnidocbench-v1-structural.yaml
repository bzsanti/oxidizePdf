end2end_eval:
  metrics:
    # Required by the upstream result renderer, which always renders these
    # diagnostics when any end-to-end metric is requested.
    text_block:
      metric:
        - Edit_dist
    table:
      metric:
        - TEDS
        # The upstream report renderer assumes this companion metric exists.
        - Edit_dist
    reading_order:
      metric:
        - Edit_dist
  dataset:
    dataset_name: end2end_dataset
    ground_truth:
      data_path: /dataset/OmniDocBench.json
    prediction:
      data_path: /predictions
    match_method: quick_match
